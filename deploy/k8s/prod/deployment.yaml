apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintech-risk-ops-analytics-worker
  namespace: prod
  labels:
    app: fintech-risk-ops-analytics-worker
    track: stable
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fintech-risk-ops-analytics-worker
      track: stable
  template:
    metadata:
      labels:
        app: fintech-risk-ops-analytics-worker
        track: stable
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: worker
          image: ghcr.io/alakhdeepsingh/fintech-risk-ops-analytics:latest
          command: ["python", "analysis/run_local_demo.py"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: ENV
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
